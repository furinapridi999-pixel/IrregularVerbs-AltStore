<title>Неправильные глаголы</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6fbf2;--card:#fff;--ink:#23301f;--soft:#6b7a66;--line:#dbe6d4;--green:#3fae3a;--greenD:#2b8a28;--greenL:#e3f6df;--red:#e5484d;--redL:#fde8e8;--blue:#2f80ed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a12;--card:#1c261b;--ink:#eaf3e6;--soft:#9aab94;--line:#2e3b2c;--greenL:#1f3a1d;--redL:#3a1d1e}}
:root[data-theme="dark"]{--bg:#121a12;--card:#1c261b;--ink:#eaf3e6;--soft:#9aab94;--line:#2e3b2c;--greenL:#1f3a1d;--redL:#3a1d1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Nunito,-apple-system,system-ui,sans-serif;font-weight:600}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px}
.top{display:flex;align-items:center;gap:12px;font-weight:900}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s}
.x{background:none;border:0;font-size:24px;color:var(--soft);cursor:pointer;padding:4px}
h1{font-size:30px;font-weight:900;margin:18px 0 4px;line-height:1.1}
h2{font-size:24px;font-weight:900;margin:8px 0 4px}
.sub{color:var(--soft);margin:0 0 18px}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stats div{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:900}
.stats span{font-size:13px;color:var(--soft)}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px 16px;margin-bottom:12px;font:inherit;color:inherit;cursor:pointer}
.mode:active{transform:translateY(3px);border-bottom-width:2px}
.mode .ic{font-size:28px;width:48px;height:48px;display:grid;place-items:center;flex:none}
.mode .num{border-radius:50%;background:var(--green);color:#fff;font-size:20px;font-weight:900}
.mode .num.full{background:var(--gold,#f5b700)}
.mode b{font-size:18px;font-weight:900;display:block}
.mode span{color:var(--soft);font-size:14px}
.mode .grow{flex:1;min-width:0}
.mini{height:8px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--green)}
.mode.review{border-color:var(--red);background:var(--redL)}
.list{margin-top:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:1.1fr 1fr 1fr 34px;gap:6px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;word-break:break-word}
.row:first-child{border-top:0;color:var(--soft);font-size:13px}
.row small{display:block;color:var(--soft);font-size:12px}
.row .st{color:var(--green)}
.spk{background:none;border:0;font-size:18px;cursor:pointer;padding:0}
input.search{font:inherit;font-size:17px;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 4px}
.lesson{flex:1;display:flex;flex-direction:column}
.q{font-size:22px;font-weight:900;margin:26px 0 6px}
.hint{color:var(--soft);margin:0 0 18px}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:24px;font-weight:900;margin:10px 0 22px;text-align:center}
.chain .arr{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:16px}
.chain .gap{min-width:90px;border-bottom:4px dashed var(--blue);color:var(--blue);padding:0 6px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:20px;font-weight:800;color:inherit;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px;cursor:pointer}
.opt.sel{border-color:var(--blue);color:var(--blue)}
.opt.ok{border-color:var(--green);color:var(--green)}
.opt.bad{border-color:var(--red);color:var(--red)}
input.type{font:inherit;font-size:22px;font-weight:800;width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.type:focus,input.search:focus{outline:none;border-color:var(--blue)}
.foot{margin-top:auto;padding-top:20px}
.btn{width:100%;font:inherit;font-size:18px;font-weight:900;border:0;border-radius:16px;padding:16px;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--greenD)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #1f5fb8;margin-top:14px}
.btn:disabled{background:var(--line);box-shadow:none;color:var(--soft);cursor:default}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.fb{border-radius:16px;padding:14px 16px;margin-bottom:12px;font-weight:800}
.fb.good{background:var(--greenL);color:var(--greenD)}
.fb.wrong{background:var(--redL);color:var(--red)}
.card{perspective:900px;height:230px;margin:20px 0;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.f .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
.face.back{transform:rotateY(180deg)}
.big{font-size:40px;font-weight:900}
.done{text-align:center;margin-top:40px}
.done .big{font-size:64px}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const RAW=`be|was/were|been|быть
have|had|had|иметь
do|did|done|делать
say|said|said|сказать
go|went|gone|идти, ехать
get|got|got/gotten|получать
make|made|made|делать, создавать
know|knew|known|знать
think|thought|thought|думать
take|took|taken|брать
see|saw|seen|видеть
come|came|come|приходить
give|gave|given|давать
find|found|found|находить
tell|told|told|рассказывать
become|became|become|становиться
leave|left|left|уходить, оставлять
feel|felt|felt|чувствовать
put|put|put|класть, ставить
bring|brought|brought|приносить
begin|began|begun|начинать
keep|kept|kept|хранить, продолжать
hold|held|held|держать
write|wrote|written|писать
stand|stood|stood|стоять
hear|heard|heard|слышать
let|let|let|позволять
mean|meant|meant|значить
set|set|set|устанавливать
meet|met|met|встречать
run|ran|run|бежать
pay|paid|paid|платить
sit|sat|sat|сидеть
speak|spoke|spoken|говорить
lie|lay|lain|лежать
lead|led|led|вести
read|read|read|читать
grow|grew|grown|расти
lose|lost|lost|терять
fall|fell|fallen|падать
send|sent|sent|отправлять
build|built|built|строить
understand|understood|understood|понимать
draw|drew|drawn|рисовать
break|broke|broken|ломать
spend|spent|spent|тратить, проводить
cut|cut|cut|резать
rise|rose|risen|подниматься
drive|drove|driven|водить машину
buy|bought|bought|покупать
wear|wore|worn|носить одежду
choose|chose|chosen|выбирать
eat|ate|eaten|есть, кушать
drink|drank|drunk|пить
sleep|slept|slept|спать
swim|swam|swum|плавать
sing|sang|sung|петь
fly|flew|flown|летать
forget|forgot|forgotten|забывать
sell|sold|sold|продавать
teach|taught|taught|учить, преподавать
catch|caught|caught|ловить
fight|fought|fought|драться, бороться
throw|threw|thrown|бросать
win|won|won|побеждать
show|showed|shown/showed|показывать
hit|hit|hit|ударять
shut|shut|shut|закрывать
cost|cost|cost|стоить
hurt|hurt|hurt|ранить, болеть
learn|learnt/learned|learnt/learned|учить, узнавать
burn|burnt/burned|burnt/burned|гореть, жечь
dream|dreamt/dreamed|dreamt/dreamed|мечтать, видеть сны
smell|smelt/smelled|smelt/smelled|пахнуть, нюхать
spell|spelt/spelled|spelt/spelled|произносить по буквам
spill|spilt/spilled|spilt/spilled|проливать
spoil|spoilt/spoiled|spoilt/spoiled|портить
lean|leant/leaned|leant/leaned|опираться
leap|leapt/leaped|leapt/leaped|прыгать
light|lit/lighted|lit/lighted|зажигать
wake|woke|woken|просыпаться
ride|rode|ridden|ехать верхом
hide|hid|hidden|прятать
bite|bit|bitten|кусать
shake|shook|shaken|трясти
steal|stole|stolen|красть
freeze|froze|frozen|замерзать
forgive|forgave|forgiven|прощать
hang|hung|hung|вешать
blow|blew|blown|дуть
dig|dug|dug|копать
feed|fed|fed|кормить
bleed|bled|bled|кровоточить
breed|bred|bred|разводить
deal|dealt|dealt|иметь дело
dwell|dwelt|dwelt|обитать
flee|fled|fled|убегать, спасаться
forbid|forbade|forbidden|запрещать
forecast|forecast|forecast|предсказывать
foresee|foresaw|foreseen|предвидеть
grind|ground|ground|молоть
kneel|knelt|knelt|стоять на коленях
lay|laid|laid|класть
lend|lent|lent|давать взаймы
bend|bent|bent|сгибать
bet|bet|bet|держать пари
bid|bid|bid|предлагать цену
bind|bound|bound|связывать
arise|arose|arisen|возникать
awake|awoke|awoken|будить, просыпаться
bear|bore|borne/born|выносить, рождать
beat|beat|beaten|бить
cast|cast|cast|бросать, отливать
cling|clung|clung|цепляться
creep|crept|crept|ползти
dive|dived/dove|dived|нырять
fit|fit/fitted|fit/fitted|подходить по размеру
fling|flung|flung|швырять
mistake|mistook|mistaken|ошибаться
misunderstand|misunderstood|misunderstood|неправильно понять
overcome|overcame|overcome|преодолевать
oversleep|overslept|overslept|проспать
overtake|overtook|overtaken|обгонять
prove|proved|proven/proved|доказывать
quit|quit|quit|бросать, уходить
rid|rid|rid|избавлять
ring|rang|rung|звонить
seek|sought|sought|искать
sew|sewed|sewn/sewed|шить
shine|shone|shone|светить, сиять
shoot|shot|shot|стрелять, снимать
shrink|shrank|shrunk|сжиматься
sink|sank|sunk|тонуть
slide|slid|slid|скользить
slit|slit|slit|разрезать
sow|sowed|sown/sowed|сеять
speed|sped|sped|мчаться
spin|spun|spun|вращать
spit|spat|spat|плевать
split|split|split|раскалывать
spread|spread|spread|распространять
spring|sprang|sprung|прыгать, вскакивать
stick|stuck|stuck|приклеивать
sting|stung|stung|жалить
stink|stank|stunk|вонять
strike|struck|struck|ударять, бастовать
strive|strove|striven|стремиться
swear|swore|sworn|клясться, ругаться
sweep|swept|swept|подметать
swell|swelled|swollen|опухать
swing|swung|swung|качать, раскачиваться
tear|tore|torn|рвать
tread|trod|trodden|ступать
undergo|underwent|undergone|подвергаться
undertake|undertook|undertaken|предпринимать
upset|upset|upset|расстраивать
weave|wove|woven|ткать
weep|wept|wept|плакать
wind|wound|wound|наматывать, заводить
withdraw|withdrew|withdrawn|снимать деньги, отзывать
broadcast|broadcast|broadcast|транслировать
burst|burst|burst|лопаться
mow|mowed|mown/mowed|косить
shed|shed|shed|сбрасывать, проливать
wet|wet|wet|мочить
rewrite|rewrote|rewritten|переписывать
`;
const VERBS=RAW.trim().split("\n").map(l=>{const[v,p,pp,ru]=l.split("|");return{v,p,pp,ru}});
const SIZE=15,UNITS=[];for(let i=0;i<VERBS.length;i+=SIZE)UNITS.push(VERBS.slice(i,i+SIZE));
const KEY="irrverbs-v1";
let S={xp:0,best:0,learned:{}};
(function load(){let raw=null;if(typeof window.__NATIVE_STATE==="string")raw=window.__NATIVE_STATE;else{try{raw=localStorage.getItem(KEY)}catch(e){}}
 try{const s=JSON.parse(raw);if(s&&typeof s==="object")S=Object.assign(S,s)}catch(e){}})();
function save(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}try{window.webkit.messageHandlers.save.postMessage(j)}catch(e){}}
const $=id=>document.getElementById(id);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,"");
const vars=s=>s.split("/");
const score=x=>S.learned[x.v]||0;
const isLearned=x=>score(x)>=3;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\//g," or "));u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const app=$("app");
const weakList=()=>VERBS.filter(x=>x.v in S.learned&&score(x)<2).slice(0,SIZE);
const row=x=>`<div class="row"><span>${x.v}${isLearned(x)?' <span class="st">✓</span>':''}<small>${x.ru}</small></span><span>${x.p}</span><span>${x.pp}</span><button class="spk" aria-label="Прослушать ${x.v}" onclick="say('${x.v}, ${x.p}, ${x.pp}')">🔊</button></div>`;
const head=`<div class="row"><span>Infinitive</span><span>Past</span><span>Participle</span><span></span></div>`;

function home(){
 window.scrollTo(0,0);
 const done=VERBS.filter(isLearned).length,weak=weakList();
 app.innerHTML=`<h1>Неправильные глаголы</h1><p class="sub">${VERBS.length} глаголов в ${UNITS.length} блоках. Глагол выучен после трёх верных ответов.</p>
 <div class="stats"><div><b>⚡ ${S.xp}</b><span>опыт</span></div><div><b>🔥 ${S.best}</b><span>лучшая серия</span></div><div><b>⭐ ${done}</b><span>из ${VERBS.length}</span></div></div>
 ${weak.length?`<button class="mode review" id="rev"><span class="ic">🩹</span><div class="grow"><b>Работа над ошибками</b><span>${weak.length} глаголов, где ты ошибался</span></div></button>`:""}
 ${UNITS.map((u,i)=>{const n=u.filter(isLearned).length;return`<button class="mode" data-u="${i}"><span class="ic num ${n===u.length?"full":""}">${n===u.length?"★":i+1}</span><div class="grow"><b>Блок ${i+1}</b><span>${u.slice(0,4).map(x=>x.v).join(", ")}…</span><div class="mini"><i style="width:${n/u.length*100}%"></i></div></div></button>`}).join("")}
 <button class="mode" id="all"><span class="ic">📖</span><div class="grow"><b>Все глаголы</b><span>Таблица с поиском и озвучкой</span></div></button>`;
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>unit(+b.dataset.u));
 if($("rev"))$("rev").onclick=()=>unitView("Работа над ошибками",weak,home);
 $("all").onclick=allVerbs;
}
function unit(i){unitView(`Блок ${i+1}`,UNITS[i],()=>unit(i))}
function unitView(title,list,back){
 window.scrollTo(0,0);
 app.innerHTML=`<div class="top"><button class="x" id="bk" aria-label="Назад">←</button><span>${title}</span></div>
 <h2 style="margin-top:16px">${list.filter(isLearned).length} из ${list.length} выучено</h2><p class="sub">Выбери, как тренироваться.</p>
 <button class="mode" data-m="cards"><span class="ic">🃏</span><div><b>Карточки</b><span>Смотри и слушай все три формы</span></div></button>
 <button class="mode" data-m="choice"><span class="ic">🎯</span><div><b>Выбери форму</b><span>Найди пропущенную форму</span></div></button>
 <button class="mode" data-m="type"><span class="ic">⌨️</span><div><b>Напиши сам</b><span>Впиши форму без подсказок</span></div></button>
 <button class="mode" data-m="listen"><span class="ic">🎧</span><div><b>На слух</b><span>Услышь глагол и выбери перевод</span></div></button>
 <div class="list">${head}${list.map(row).join("")}</div>`;
 $("bk").onclick=home;
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>b.dataset.m==="cards"?cards(list,back):lesson(b.dataset.m,list,back));
}
function allVerbs(){
 window.scrollTo(0,0);
 app.innerHTML=`<div class="top"><button class="x" id="bk" aria-label="Назад">←</button><span>Все глаголы</span></div>
 <input class="search" id="q" placeholder="Поиск: go, went, писать…" autocomplete="off" autocapitalize="off" aria-label="Поиск"><div class="list" id="tb"></div>`;
 const draw=f=>{f=norm(f);$("tb").innerHTML=head+VERBS.filter(x=>!f||[x.v,x.p,x.pp,x.ru].some(s=>s.toLowerCase().includes(f))).map(row).join("")};
 $("bk").onclick=home;$("q").oninput=e=>draw(e.target.value);draw("");
}
function cards(list,back){
 let i=0;const deck=shuffle(list);
 const draw=()=>{const x=deck[i];
 app.innerHTML=`<div class="top"><button class="x" id="cl" aria-label="Закрыть">✕</button><div class="bar"><i style="width:${i/deck.length*100}%"></i></div><span>${i+1}/${deck.length}</span></div>
 <div class="lesson"><p class="q">Нажми на карточку, чтобы перевернуть</p>
 <div class="card" id="c"><div class="inner"><div class="face"><div class="big">${x.v}</div><div class="sub">${x.ru}</div></div>
 <div class="face back"><div class="big" style="font-size:28px">${x.v} › ${x.p} › ${x.pp}</div><div class="sub">${x.ru}</div></div></div></div>
 <div class="foot"><button class="btn" id="nx">${i<deck.length-1?"Дальше":"Готово"}</button></div></div>`;
 $("cl").onclick=back;
 $("c").onclick=()=>{$("c").classList.toggle("f");if($("c").classList.contains("f"))say(`${x.v}, ${x.p}, ${x.pp}`)};
 $("nx").onclick=()=>{i++;if(i<deck.length)draw();else{S.xp+=5;save();back()}}};
 draw();
}
function regular(v){if(v.endsWith("e"))return v+"d";if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+"ied";return v+"ed"}
let lastV=null;
function makeTask(mode,list){
 let x;do{x=list[Math.floor(Math.random()*list.length)]}while(list.length>1&&x===lastV);lastV=x;
 if(mode==="listen"){const others=shuffle(VERBS.filter(y=>y.ru!==x.ru)).slice(0,3).map(y=>y.ru);return{x,ans:x.ru,opts:shuffle([x.ru,...others])}}
 const slot=Math.random()<.5?"p":"pp",ans=x[slot],av=vars(ans);
 const clash=w=>w===ans||vars(w).some(z=>av.includes(z));
 const cand=[x.v,x.p,x.pp,regular(x.v)];
 shuffle(list.concat(shuffle(VERBS).slice(0,10))).forEach(y=>cand.push(y[slot]));
 const pool=[ans];for(const w of cand){if(pool.length>=4)break;if(!clash(w)&&!pool.includes(w))pool.push(w)}
 return{x,slot,ans,opts:shuffle(pool)};
}
function lesson(mode,list,back){
 const total=10;let n=0,hearts=5,correct=0,streak=0,task,picked=null,checked=false;
 const next=()=>{task=makeTask(mode,list);picked=null;checked=false;draw()};
 const draw=()=>{const t=task,x=t.x;let body="";
  if(mode==="listen")body=`<p class="q">Что означает этот глагол?</p><p class="hint">Нажми, чтобы прослушать ещё раз</p><div class="chain"><button class="opt" id="rep" style="font-size:40px;width:110px" aria-label="Прослушать">🔊</button></div>`;
  else{const g=`<span class="gap" id="gap">?</span>`;
   body=`<p class="q">${t.slot==="p"?"Вставь Past Simple":"Вставь Past Participle"}</p><p class="hint">${x.ru}</p>
   <div class="chain"><span>${x.v}</span><span class="arr">›</span>${t.slot==="p"?g:`<span>${x.p}</span>`}<span class="arr">›</span>${t.slot==="pp"?g:`<span>${x.pp}</span>`}</div>`}
  const input=mode==="type"?`<input class="type" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Впиши форму" aria-label="Ответ">`
   :`<div class="opts">${t.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="top"><button class="x" id="cl" aria-label="Закрыть">✕</button><div class="bar"><i style="width:${n/total*100}%"></i></div><span>❤️ ${hearts}</span></div>
  <div class="lesson">${body}${input}<div class="foot"><div id="fb"></div><button class="btn" id="go" disabled>Проверить</button></div></div>`;
  $("cl").onclick=back;
  if(mode==="listen"){$("rep").onclick=()=>say(x.v);setTimeout(()=>say(x.v),250)}
  if(mode==="type"){const i=$("in");i.focus();i.oninput=()=>{$("go").disabled=!i.value.trim()};i.onkeydown=e=>{if(e.key==="Enter"&&!$("go").disabled)$("go").click()}}
  else document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>{if(checked)return;picked=t.opts[b.dataset.k];
   document.querySelectorAll(".opt[data-k]").forEach(z=>z.classList.remove("sel"));b.classList.add("sel");
   if($("gap"))$("gap").textContent=picked;if(mode!=="listen")say(picked);$("go").disabled=false});
  $("go").onclick=check};
 const check=()=>{
  if(checked){n++;if(hearts<=0||n>=total)return finish();return next()}
  checked=true;const t=task,given=mode==="type"?$("in").value:picked;
  const ok=mode==="type"?(norm(given)===norm(t.ans)||vars(t.ans).includes(norm(given))):given===t.ans;
  if(mode==="type")$("in").disabled=true;
  else document.querySelectorAll(".opt[data-k]").forEach(b=>{const o=t.opts[b.dataset.k];if(o===t.ans)b.classList.add("ok");else if(o===given)b.classList.add("bad")});
  if(ok){correct++;streak++;S.xp+=10;S.learned[t.x.v]=score(t.x)+1;S.best=Math.max(S.best,streak);
   $("fb").innerHTML=`<div class="fb good">✅ Верно!${streak>2?" 🔥 Серия "+streak:""}</div>`}
  else{hearts--;streak=0;S.learned[t.x.v]=Math.max(0,score(t.x)-1);
   $("fb").innerHTML=`<div class="fb wrong">Правильно: ${t.x.v} › ${t.x.p} › ${t.x.pp}</div>`}
  save();say(`${t.x.v}, ${t.x.p}, ${t.x.pp}`);$("go").textContent="Дальше";$("go").disabled=false};
 const finish=()=>{const win=hearts>0;
  app.innerHTML=`<div class="done"><div class="big">${win?"🏆":"💔"}</div><h1>${win?"Урок пройден":"Жизни закончились"}</h1>
  <p class="sub">Правильно ${correct} из ${n}. Всего опыта: ⚡ ${S.xp}</p></div>
  <div class="foot"><button class="btn" id="again">Ещё раз</button><button class="btn blue" id="bk">Назад к блоку</button></div>`;
  $("again").onclick=()=>lesson(mode,list,back);$("bk").onclick=back};
 next();
}
home();
</script>
</body>
