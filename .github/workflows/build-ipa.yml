name: Build IPA for AltStore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project IrregularVerbs.xcodeproj \
            -scheme IrregularVerbs \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IrregularVerbs.app Payload/
          zip -qr IrregularVerbs.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IrregularVerbs-ipa
          path: ios/IrregularVerbs.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" ios/IrregularVerbs.ipa \
            --title "Глаголы v2.0.${{ github.run_number }}" \
            --notes "Файл IrregularVerbs.ipa открой в AltStore."
